name: Historical source recovery
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ingest.yml
      - scripts/source_probe.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: historical-source-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-lock.txt
      - name: Probe public data routes from runner
        run: python scripts/source_probe.py
      - name: Download complete native M1 history when runner access works
        run: |
          python - <<'PY'
          import json,subprocess
          rows=json.load(open('data/source_probe_report.json'))['sources']
          if any(r.get('candle_records',0) and r.get('status')==200 for r in rows if r['name'].startswith('dukascopy_legacy')):
              subprocess.run(['python','scripts/run_pipeline.py','--start','2024-01-01','--end','2026-10-19','--workers','4','--transport','requests','--attempts','3','--timeout','25'],check=False)
          PY
      - name: Save audited outcomes and any genuine data
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/source_probe_report.json data/download_manifest.jsonl data/curated public/data experiments
          if ! git diff --cached --quiet; then
            git commit -m 'Record runner source recovery and genuine historical exports'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
