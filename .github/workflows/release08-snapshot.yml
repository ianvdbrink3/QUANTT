name: Release 0.8 deterministic public snapshot
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release08-public-snapshot
  cancel-in-progress: false
jobs:
  refresh:
    if: "!contains(github.event.head_commit.message, '[research-export]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install pinned Python dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Validate full Python suite
        run: python -m pytest -q
      - name: Generate Python-computed NQ/ES synthetic reference
        run: python scripts/export_research08.py --bars 1700 --out public/data/research08.json
      - name: Validate synthetic provenance and source segregation
        run: |
          python - <<'PY'
          import json
          p=json.load(open('public/data/research08.json'))
          assert p['classification']=='DETERMINISTIC SYNTHETIC REFERENCE'
          assert len(p['runs'])==2
          assert {r['instrument'] for r in p['runs']}=={'NQ','ES'}
          assert all(not r['edge_validated'] for r in p['runs'])
          assert all(r['governance']['holdout_sealed'] and not r['governance']['holdout_scored'] for r in p['runs'])
          assert p['sources'][0]['market_type']=='index_cfd'
          assert p['sources'][1]['observed_bars']==0
          PY
      - name: Commit generated public snapshot only
        run: |
          if ! git diff --quiet -- public/data/research08.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add public/data/research08.json
            git commit -m 'Publish reproducible 0.8 synthetic research export [research-export]'
            git push origin HEAD:main
          else
            echo 'Reference already identical.'
          fi
